name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked database/secret-bearing artifacts
        run: |
          # 2026-10-04 security incident: data/argus.db.stale-preswitch-2026-08-10 and 6 sibling
          # *.db-shm/*.db-wal files were tracked in git since commit fd90cfe, bypassing
          # .gitignore's data/*.db pattern (it didn't match suffixed filenames). This check fails
          # the build if any SQLite database/WAL/SHM file is tracked anywhere in the repo, so a
          # future commit can never silently reintroduce one.
          offenders=$(git ls-tree -r HEAD --name-only | grep -iE '\.(db|sqlite)([.\-]|$)' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked database artifact(s) found - these must never be committed:"
            echo "$offenders"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
